name: 🚀 Flutter Auto-Upgrade

on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create Pull Request with fixes?'
        required: true
        default: 'true'
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  analyze:
    name: 🔍 Analyze Project
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.versions.outputs.flutter_version }}
      has_issues: ${{ steps.check.outputs.has_issues }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter version
        id: versions
        run: |
          FLUTTER_VER=$(flutter --version | head -1 | awk '{print $2}')
          DART_VER=$(dart --version | awk '{print $4}')
          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT
          echo "dart_version=$DART_VER" >> $GITHUB_OUTPUT

      - name: Check outdated packages
        id: check
        run: |
          flutter pub get || true
          OUTDATED=$(flutter pub outdated --json 2>/dev/null || echo '{}')
          echo "$OUTDATED" > /tmp/outdated.json
          COUNT=$(echo "$OUTDATED" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          packages = data.get('packages', [])
          outdated = [p for p in packages if p.get('latest', {}).get('version') != p.get('current', {}).get('version')]
          print(len(outdated))
          " 2>/dev/null || echo "0")
          echo "has_issues=true" >> $GITHUB_OUTPUT
          echo "outdated_count=$COUNT" >> $GITHUB_OUTPUT

      - name: Upload outdated report
        uses: actions/upload-artifact@v4
        with:
          name: outdated-report
          path: /tmp/outdated.json

  upgrade:
    name: 🔧 Apply Upgrades
    runs-on: ubuntu-latest
    needs: analyze
    outputs:
      branch_name: ${{ steps.branch.outputs.branch_name }}
      changes_made: ${{ steps.commit.outputs.changes_made }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create upgrade branch
        id: branch
        run: |
          BRANCH="chore/flutter-upgrade-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Fix AGP 7.3.0 to 8.7.0 and Kotlin 1.9.0 to 2.1.0
        run: |
          sed -i 's/id "com.android.application" version "7.3.0"/id "com.android.application" version "8.7.0"/' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.9.0"/id "org.jetbrains.kotlin.android" version "2.1.0"/' android/settings.gradle

      - name: Fix Gradle Wrapper 7.4 to 8.9
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-all.zip
          EOF

      - name: Fix compileSdkVersion 34 to 35
        run: |
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/' android/app/build.gradle
          sed -i 's/compileSdk 34/compileSdk 35/' android/app/build.gradle

      - name: Upgrade Flutter packages
        run: flutter pub upgrade --major-versions 2>&1 | tee /tmp/upgrade-log.txt

      - name: Replace abandoned flutter_countdown_timer
        run: |
          python3 << 'PYEOF'
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          content = content.replace(
              'flutter_countdown_timer: ^4.1.0',
              'timer_builder: ^2.0.0'
          )
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          print("Done")
          PYEOF

      - name: flutter pub get
        run: flutter pub get 2>&1 | tee /tmp/pub-get-log.txt

      - name: flutter analyze
        run: flutter analyze 2>&1 | tee /tmp/analyze-log.txt
        continue-on-error: true

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "changes_made=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: upgrade Flutter dependencies and toolchain"
            echo "changes_made=true" >> $GITHUB_OUTPUT
          fi

      - name: Push branch
        if: steps.commit.outputs.changes_made == 'true'
        run: git push origin HEAD

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-logs
          path: |
            /tmp/upgrade-log.txt
            /tmp/pub-get-log.txt
            /tmp/analyze-log.txt

  build-test:
    name: 🏗️ Build Test APK
    runs-on: ubuntu-latest
    needs: upgrade
    if: needs.upgrade.outputs.changes_made == 'true'
    outputs:
      build_success: ${{ steps.build.outputs.success }}
      build_error: ${{ steps.build.outputs.error }}
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.upgrade.outputs.branch_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK debug
        id: build
        run: |
          flutter build apk --debug 2>&1 | tee /tmp/build-log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -eq 0 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            ERROR=$(tail -30 /tmp/build-log.txt | tr '\n' ' ' | cut -c1-500)
            echo "error=$ERROR" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Upload APK
        if: steps.build.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build-log.txt

  report:
    name: 📋 Create PR and Issue
    runs-on: ubuntu-latest
    needs: [upgrade, build-test]
    if: always() && needs.upgrade.outputs.changes_made == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ needs.upgrade.outputs.branch_name }}
          base: master
          title: "🚀 chore: Flutter and Android toolchain upgrade"
          body: |
            ## Flutter Auto-Upgrade

            Avtomatik yaratildi.

            | Komponent | Oldingi | Yangi |
            |-----------|---------|-------|
            | AGP | 7.3.0 | 8.7.0 |
            | Kotlin | 1.9.0 | 2.1.0 |
            | Gradle | 7.4 | 8.9 |
            | compileSdkVersion | 34 | 35 |
            | flutter_countdown_timer | abandoned | timer_builder |
          labels: |
            dependencies
            flutter

      - name: Create Issue
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ needs.build-test.outputs.build_success }}' === 'true';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: success
                ? '✅ Flutter upgrade muvaffaqiyatli — PR tayyor'
                : '❌ Flutter upgrade: build xatoligi',
              body: success
                ? `## ✅ Muvaffaqiyatli!\n\nBranch: \`${{ needs.upgrade.outputs.branch_name }}\`\n\nPR merge qiling.`
                : `## ❌ Build xatoligi\n\nBranch: \`${{ needs.upgrade.outputs.branch_name }}\`\n\n\`\`\`\n${{ needs.build-test.outputs.build_error }}\n\`\`\`\n\nArtifacts → build-log dan to'liq logni ko'ring.`,
              labels: success ? ['enhancement', 'flutter'] : ['bug', 'flutter']
            });
